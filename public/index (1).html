<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>NEXORA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg:#04070d;
    --bg2:#070c16;
    --cyan:#3fe3ff;
    --cyan-dim:#1b7d94;
    --violet:#8b5cf6;
    --ink:#eef4fa;
    --muted:#7b8aa0;
    --bubble-bot:#0a1220;
    --bubble-user:#0f2436;
    --border:rgba(63,227,255,0.18);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{height:100%;}

  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(63,227,255,0.10), transparent 60%),
      radial-gradient(ellipse 700px 400px at 90% 100%, rgba(139,92,246,0.08), transparent 60%),
      var(--bg);
    font-family:'Inter', sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow:hidden;
    position:relative;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  /* ambient circuit grid */
  body::before{
    content:'';
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(63,227,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(63,227,255,0.035) 1px, transparent 1px);
    background-size:42px 42px;
    mask-image:radial-gradient(ellipse 80% 60% at 50% 20%, black, transparent 75%);
    pointer-events:none;
    z-index:0;
  }

  header{
    position:relative;
    z-index:2;
    padding:22px 24px 18px;
    display:flex;
    align-items:center;
    gap:16px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, rgba(5,10,18,0.9), rgba(5,10,18,0.4));
    backdrop-filter:blur(6px);
  }

  .avatar{
    width:46px; height:46px;
    border-radius:50%;
    flex-shrink:0;
    border:1px solid var(--cyan);
    box-shadow:0 0 18px rgba(63,227,255,0.55), inset 0 0 12px rgba(63,227,255,0.4);
    position:relative;
    overflow:hidden;
  }
  .avatar img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .avatar::after{
    content:'';
    position:absolute; inset:0;
    border-radius:50%;
    border:1px solid rgba(63,227,255,0.35);
    animation:pulse-ring 2.6s ease-out infinite;
  }
  @keyframes pulse-ring{
    0%{transform:scale(1); opacity:0.9;}
    100%{transform:scale(1.9); opacity:0;}
  }

  .brand{
    display:flex;
    flex-direction:column;
    line-height:1;
  }
  .brand .word{
    font-family:'Orbitron', sans-serif;
    font-weight:900;
    font-size:22px;
    letter-spacing:2px;
    color:var(--ink);
    text-shadow:0 0 14px rgba(63,227,255,0.45);
  }
  .brand .word span{
    color:var(--cyan);
    text-shadow:0 0 18px rgba(63,227,255,0.9), 0 0 34px rgba(63,227,255,0.5);
  }
  .brand .tag{
    font-family:'Rajdhani', sans-serif;
    font-size:11.5px;
    letter-spacing:1.6px;
    text-transform:uppercase;
    color:var(--muted);
    margin-top:3px;
  }

  .status{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:7px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--cyan-dim);
    letter-spacing:0.5px;
  }
  .status .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 8px var(--cyan);
    animation:blink 1.8s ease-in-out infinite;
  }
  @keyframes blink{ 50%{opacity:0.35;} }

  main{
    position:relative;
    z-index:1;
    flex:1;
    overflow-y:auto;
    padding:26px 18px 10px;
    display:flex;
    flex-direction:column;
    gap:16px;
    scroll-behavior:smooth;
  }
  main::-webkit-scrollbar{width:6px;}
  main::-webkit-scrollbar-thumb{background:rgba(63,227,255,0.25); border-radius:6px;}

  .row{
    display:flex;
    max-width:780px;
    width:100%;
    margin:0 auto;
  }
  .row.user{ justify-content:flex-end; }
  .row.bot{ justify-content:flex-start; }

  .bubble{
    max-width:78%;
    padding:12px 16px;
    border-radius:14px;
    font-size:15px;
    line-height:1.55;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .row.user .bubble{
    background:var(--bubble-user);
    border:1px solid rgba(63,227,255,0.28);
    border-bottom-right-radius:4px;
    color:var(--ink);
  }
  .row.bot .bubble{
    background:var(--bubble-bot);
    border:1px solid var(--border);
    border-bottom-left-radius:4px;
    box-shadow:0 0 20px rgba(63,227,255,0.05);
  }
  .row.bot .bubble code{
    font-family:'JetBrains Mono', monospace;
    background:rgba(63,227,255,0.08);
    padding:1px 5px;
    border-radius:4px;
    font-size:13px;
  }
  .row.bot .bubble pre{
    background:#050a12;
    border:1px solid var(--border);
    padding:10px 12px;
    border-radius:8px;
    overflow-x:auto;
    margin:8px 0;
  }
  .row.bot .bubble pre code{ background:none; padding:0; }

  .typing{
    display:flex; gap:4px; align-items:center; padding:4px 2px;
  }
  .typing span{
    width:6px; height:6px; border-radius:50%;
    background:var(--cyan);
    opacity:0.5;
    animation:typing-bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:0.15s;}
  .typing span:nth-child(3){animation-delay:0.3s;}
  @keyframes typing-bounce{
    0%,60%,100%{transform:translateY(0); opacity:0.4;}
    30%{transform:translateY(-4px); opacity:1;}
  }

  .empty{
    margin:auto;
    text-align:center;
    color:var(--muted);
    max-width:420px;
    padding:20px;
  }
  .empty img{
    width:120px; height:120px;
    border-radius:50%;
    object-fit:cover;
    border:1px solid var(--cyan);
    box-shadow:0 0 30px rgba(63,227,255,0.5), inset 0 0 16px rgba(63,227,255,0.35);
    margin-bottom:16px;
  }
  .empty .word{
    font-family:'Orbitron', sans-serif;
    font-weight:900;
    font-size:34px;
    letter-spacing:3px;
    color:var(--ink);
    text-shadow:0 0 22px rgba(63,227,255,0.4);
    margin-bottom:10px;
  }
  .empty .word span{ color:var(--cyan); text-shadow:0 0 22px rgba(63,227,255,0.85); }
  .empty p{ font-family:'Rajdhani', sans-serif; font-size:14px; letter-spacing:0.6px; }

  footer{
    position:relative;
    z-index:2;
    padding:16px 18px 20px;
    border-top:1px solid var(--border);
    background:linear-gradient(0deg, rgba(5,10,18,0.95), rgba(5,10,18,0.5));
    backdrop-filter:blur(6px);
  }

  form{
    max-width:780px;
    margin:0 auto;
    display:flex;
    gap:10px;
    align-items:flex-end;
  }

  textarea{
    flex:1;
    resize:none;
    background:#070f1a;
    border:1px solid var(--border);
    border-radius:12px;
    color:var(--ink);
    font-family:'Inter', sans-serif;
    font-size:15px;
    padding:12px 14px;
    max-height:140px;
    min-height:46px;
    line-height:1.4;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  textarea:focus{
    border-color:var(--cyan);
    box-shadow:0 0 0 3px rgba(63,227,255,0.12), 0 0 18px rgba(63,227,255,0.15);
  }
  textarea::placeholder{ color:var(--muted); }

  button{
    flex-shrink:0;
    width:46px; height:46px;
    border-radius:12px;
    border:1px solid var(--cyan);
    background:linear-gradient(135deg, rgba(63,227,255,0.18), rgba(139,92,246,0.12));
    color:var(--cyan);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .1s, box-shadow .15s;
  }
  button:hover{ box-shadow:0 0 16px rgba(63,227,255,0.5); }
  button:active{ transform:scale(0.94); }
  button:disabled{ opacity:0.4; cursor:not-allowed; box-shadow:none; }
  button svg{ width:19px; height:19px; }

  @media (prefers-reduced-motion: reduce){
    .avatar::after, .status .dot, .typing span{ animation:none; }
  }

  /* Header controls */
  .icon-btn{
    background:none; border:1px solid var(--border); color:var(--cyan);
    width:38px; height:38px; border-radius:10px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    transition:background .15s, box-shadow .15s;
  }
  .icon-btn:hover{ background:rgba(63,227,255,0.08); box-shadow:0 0 10px rgba(63,227,255,0.3); }
  .icon-btn svg{ width:18px; height:18px; }

  /* Drawer */
  .drawer-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.5);
    z-index:9; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .drawer-overlay.open{ opacity:1; pointer-events:auto; }

  .drawer{
    position:fixed; top:0; left:0; bottom:0; width:280px; max-width:82vw;
    background:var(--bg2); border-right:1px solid var(--border);
    z-index:10; transform:translateX(-100%); transition:transform .22s ease;
    display:flex; flex-direction:column; padding:16px;
  }
  .drawer.open{ transform:translateX(0); }

  .drawer h2{
    font-family:'Rajdhani', sans-serif; font-size:12px; letter-spacing:1.6px;
    text-transform:uppercase; color:var(--muted); margin:14px 0 8px 4px;
  }

  .new-chat-btn{
    display:flex; align-items:center; gap:8px;
    background:linear-gradient(135deg, rgba(63,227,255,0.16), rgba(139,92,246,0.1));
    border:1px solid var(--cyan); color:var(--ink);
    padding:10px 14px; border-radius:10px; font-family:'Rajdhani', sans-serif;
    font-weight:600; font-size:14px; letter-spacing:0.5px; cursor:pointer;
    transition:box-shadow .15s;
  }
  .new-chat-btn:hover{ box-shadow:0 0 14px rgba(63,227,255,0.4); }
  .new-chat-btn svg{ width:16px; height:16px; }

  .chat-list{
    flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:4px;
  }
  .chat-item{
    padding:9px 10px; border-radius:8px; cursor:pointer;
    font-size:13.5px; color:var(--ink); white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; border:1px solid transparent;
  }
  .chat-item:hover{ background:rgba(63,227,255,0.06); }
  .chat-item.active{ background:rgba(63,227,255,0.1); border-color:var(--border); color:var(--cyan); }
  .chat-empty-note{ color:var(--muted); font-size:12.5px; padding:8px 10px; font-family:'Rajdhani', sans-serif; }

  .drawer-footer{
    font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--muted);
    padding:10px 4px 2px; border-top:1px solid var(--border); margin-top:8px;
  }

  /* Code block toolbar */
  .code-wrap{ position:relative; margin:8px 0; }
  .code-toolbar{
    display:flex; justify-content:space-between; align-items:center;
    background:#081019; border:1px solid var(--border); border-bottom:none;
    padding:5px 10px; border-radius:8px 8px 0 0;
    font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--muted);
  }
  .code-toolbar .code-actions{ display:flex; gap:10px; }
  .code-toolbar button{
    background:none; border:none; color:var(--cyan); cursor:pointer;
    font-family:'JetBrains Mono', monospace; font-size:10.5px;
    letter-spacing:0.4px; opacity:0.85;
  }
  .code-toolbar button:hover{ opacity:1; text-decoration:underline; }
  .code-wrap pre{ margin:0 !important; border-radius:0 0 8px 8px !important; border-top:none !important; }

  .svg-preview{
    background:#fff; border-radius:8px; padding:12px; margin:8px 0;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--border);
  }
  .svg-preview svg{ max-width:100%; max-height:260px; }

  /* Message action row */
  .msg-actions{
    display:flex; gap:12px; margin-top:8px; padding-top:6px;
  }
  .msg-actions button{
    background:none; border:none; color:var(--muted); cursor:pointer;
    display:flex; align-items:center; gap:4px;
    font-family:'JetBrains Mono', monospace; font-size:10.5px;
    letter-spacing:0.4px; transition:color .15s;
  }
  .msg-actions button:hover{ color:var(--cyan); }
  .msg-actions button svg{ width:13px; height:13px; }
  .msg-actions button.active{ color:var(--cyan); }

  /* Ajustes de botones en mensajes y código */
  .msg-actions button, .code-toolbar button{
    width:auto; height:auto; border:none; border-radius:0; background:none;
    padding:2px 0; white-space:nowrap; flex-shrink:0;
  }
  .msg-actions button:hover, .code-toolbar button:hover{ box-shadow:none; }
  .msg-actions{ gap:18px; margin-top:6px; padding-top:4px; }
  .code-toolbar .code-actions{ gap:14px; }
</style>
</head>
<body>

<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer">
  <button class="new-chat-btn" id="newChatBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    Nuevo chat
  </button>
  <h2>Historial</h2>
  <div class="chat-list" id="chatList"></div>
</div>

<header>
  <button class="icon-btn" id="menuBtn" aria-label="Historial">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
  </button>
  <div class="avatar"><img src="logo.jpeg" alt="Nexora"></div>
  <div class="brand">
    <div class="word">NE<span>X</span>ORA</div>
    <div class="tag">Tu aliada para cualquier duda</div>
  </div>
  <div class="status"><span class="dot"></span>EN LÍNEA</div>
</header>

<main id="chat">
  <div class="empty" id="emptyState">
    <img src="logo.jpeg" alt="Nexora">
    <div class="word">NE<span>X</span>ORA</div>
    <p>Preguntá lo que sea. Respuestas, textos, código, ideas — todo en un mismo lugar.</p>
  </div>
</main>

<footer>
  <form id="form">
    <textarea id="input" placeholder="Escribí un mensaje..." rows="1" autofocus></textarea>
    <button type="submit" id="sendBtn" aria-label="Enviar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </form>
</footer>

<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  let emptyState = document.getElementById('emptyState');
  const menuBtn = document.getElementById('menuBtn');
  const drawer = document.getElementById('drawer');
  const drawerOverlay = document.getElementById('drawerOverlay');
  const newChatBtn = document.getElementById('newChatBtn');
  const chatListEl = document.getElementById('chatList');

  let currentChatId = null;
  let history = [];
  let chatsIndex = []; // [{id, title, updatedAt}]
  let speaking = null; // bubble currently reading aloud

  function uid(){
    return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function scrollDown(){
    chat.scrollTop = chat.scrollHeight;
  }

  function escapeHtml(str){
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  const EXT_MAP = {
    javascript:'js', js:'js', python:'py', py:'py', json:'json', html:'html',
    css:'css', csv:'csv', markdown:'md', md:'md', bash:'sh', sh:'sh',
    text:'txt', txt:'txt', xml:'xml', yaml:'yml', yml:'yml', sql:'sql', svg:'svg'
  };

  function downloadText(filename, content){
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function copyText(str, btn){
    const done = (label) => {
      const orig = btn.textContent;
      btn.textContent = label;
      setTimeout(() => { btn.textContent = orig; }, 1200);
    };
    try {
      navigator.clipboard.writeText(str).then(() => done('Copiado'), () => done('No se pudo'));
    } catch (e) { done('No se pudo'); }
  }

  // Renders message text, extracting fenced code blocks into toolbars (+ SVG preview)
  function renderMessage(container, text){
    container.innerHTML = '';
    const codeRe = /```(\w*)\n?([\s\S]*?)```/g;
    let lastIndex = 0;
    let match;
    let blockIndex = 0;
    let hasContent = false;

    function appendTextChunk(chunk){
      if (!chunk.trim() && !chunk.includes('\n')) return;
      let escaped = escapeHtml(chunk);
      escaped = escaped.replace(/`([^`]+)`/g, '<code>$1</code>');
      escaped = escaped.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
      const span = document.createElement('span');
      span.innerHTML = escaped;
      container.appendChild(span);
      hasContent = true;
    }

    while ((match = codeRe.exec(text)) !== null) {
      appendTextChunk(text.slice(lastIndex, match.index));
      const lang = (match[1] || '').toLowerCase();
      const code = match[2].replace(/\n$/, '');
      const ext = EXT_MAP[lang] || (lang || 'txt');
      blockIndex++;

      if (lang === 'svg' && /^\s*<svg/i.test(code)) {
        const preview = document.createElement('div');
        preview.className = 'svg-preview';
        preview.innerHTML = code;
        container.appendChild(preview);

        const toolbar = document.createElement('div');
        toolbar.className = 'code-toolbar';
        toolbar.style.borderRadius = '8px';
        toolbar.style.marginTop = '-4px';
        toolbar.innerHTML = `<span>imagen.svg</span><div class="code-actions"><button type="button" data-act="copy">Copiar código</button><button type="button" data-act="download">Descargar</button></div>`;
        container.appendChild(toolbar);
        toolbar.querySelector('[data-act="copy"]').addEventListener('click', () => copyText(code, toolbar.querySelector('[data-act="copy"]')));
        toolbar.querySelector('[data-act="download"]').addEventListener('click', () => downloadText('imagen.svg', code));
      } else {
        const wrap = document.createElement('div');
        wrap.className = 'code-wrap';
        const toolbar = document.createElement('div');
        toolbar.className = 'code-toolbar';
        toolbar.innerHTML = `<span>${escapeHtml(lang || 'código')}</span><div class="code-actions"><button type="button" data-act="copy">Copiar</button><button type="button" data-act="download">Descargar</button></div>`;
        const pre = document.createElement('pre');
        const codeEl = document.createElement('code');
        codeEl.textContent = code;
        pre.appendChild(codeEl);
        wrap.appendChild(toolbar);
        wrap.appendChild(pre);
        container.appendChild(wrap);
        toolbar.querySelector('[data-act="copy"]').addEventListener('click', () => copyText(code, toolbar.querySelector('[data-act="copy"]')));
        toolbar.querySelector('[data-act="download"]').addEventListener('click', () => downloadText(`archivo_${blockIndex}.${ext}`, code));
      }
      hasContent = true;
      lastIndex = codeRe.lastIndex;
    }
    appendTextChunk(text.slice(lastIndex));
    if (!hasContent) container.innerHTML = escapeHtml(text);
  }

  function addMessageActions(bubble, role, text){
    const actions = document.createElement('div');
    actions.className = 'msg-actions';

    if (role === 'bot') {
      const speakBtn = document.createElement('button');
      speakBtn.type = 'button';
      speakBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg> Escuchar';
      speakBtn.addEventListener('click', () => toggleSpeak(speakBtn, text));
      actions.appendChild(speakBtn);
    }

    if (role === 'bot') {
      const dlBtn = document.createElement('button');
      dlBtn.type = 'button';
      dlBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Descargar';
      dlBtn.addEventListener('click', () => downloadText('respuesta.txt', text));
      actions.appendChild(dlBtn);
    }

    if (actions.children.length) bubble.appendChild(actions);
  }

  function toggleSpeak(btn, text){
    if (!('speechSynthesis' in window)) return;
    if (speaking === btn) {
      window.speechSynthesis.cancel();
      speaking = null;
      btn.classList.remove('active');
      return;
    }
    window.speechSynthesis.cancel();
    document.querySelectorAll('.msg-actions button.active').forEach(b => b.classList.remove('active'));
    const plain = text.replace(/```[\s\S]*?```/g, ' código omitido ').replace(/[*#`]/g, '');
    const utter = new SpeechSynthesisUtterance(plain);
    utter.lang = 'es-ES';
    utter.onend = () => { btn.classList.remove('active'); speaking = null; };
    speaking = btn;
    btn.classList.add('active');
    window.speechSynthesis.speak(utter);
  }

  function addRow(role, content){
    if (emptyState) { emptyState.remove(); emptyState = null; }
    const row = document.createElement('div');
    row.className = 'row ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (role === 'bot' && content === null){
      bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    } else {
      const textContainer = document.createElement('div');
      renderMessage(textContainer, content);
      bubble.appendChild(textContainer);
      addMessageActions(bubble, role, content);
    }
    row.appendChild(bubble);
    chat.appendChild(row);
    scrollDown();
    return bubble;
  }

  function renderEmptyState(){
    chat.innerHTML = `<div class="empty" id="emptyState">
      <div class="word">NE<span>X</span>ORA</div>
      <p>Preguntá lo que sea. Respuestas, textos, código, ideas — todo en un mismo lugar.</p>
    </div>`;
    emptyState = document.getElementById('emptyState');
  }

  function renderHistoryIntoChat(){
    chat.innerHTML = '';
    emptyState = null;
    if (history.length === 0) {
      renderEmptyState();
      return;
    }
    history.forEach(msg => addRow(msg.role === 'user' ? 'user' : 'bot', msg.content));
  }

  // --- Historial guardado en el navegador ---
  async function loadChatsIndex(){
    try {
      const v = localStorage.getItem('nexora:chats-index');
      chatsIndex = v ? JSON.parse(v) : [];
    } catch (e) {
      chatsIndex = [];
    }
  }

  async function saveChatsIndex(){
    try { localStorage.setItem('nexora:chats-index', JSON.stringify(chatsIndex)); } catch (e) {}
  }

  async function loadChat(id){
    try {
      const v = localStorage.getItem('nexora:chat:' + id);
      return v ? JSON.parse(v) : [];
    } catch (e) {
      return [];
    }
  }

  async function saveCurrentChat(){
    if (!currentChatId) return;
    try { localStorage.setItem('nexora:chat:' + currentChatId, JSON.stringify(history)); } catch (e) {}
  }

  function renderChatList(){
    chatListEl.innerHTML = '';
    if (chatsIndex.length === 0) {
      chatListEl.innerHTML = '<div class="chat-empty-note">Todavía no hay chats guardados.</div>';
      return;
    }
    const sorted = [...chatsIndex].sort((a, b) => b.updatedAt - a.updatedAt);
    sorted.forEach(c => {
      const item = document.createElement('div');
      item.className = 'chat-item' + (c.id === currentChatId ? ' active' : '');
      item.textContent = c.title || 'Chat sin título';
      item.addEventListener('click', () => openChat(c.id));
      chatListEl.appendChild(item);
    });
  }

  async function openChat(id){
    currentChatId = id;
    history = await loadChat(id);
    renderHistoryIntoChat();
    renderChatList();
    closeDrawer();
  }

  function startNewChat(){
    currentChatId = uid();
    history = [];
    renderEmptyState();
    renderChatList();
    closeDrawer();
  }

  function openDrawer(){ drawer.classList.add('open'); drawerOverlay.classList.add('open'); }
  function closeDrawer(){ drawer.classList.remove('open'); drawerOverlay.classList.remove('open'); }
  menuBtn.addEventListener('click', () => {
    drawer.classList.contains('open') ? closeDrawer() : openDrawer();
  });
  drawerOverlay.addEventListener('click', closeDrawer);
  newChatBtn.addEventListener('click', startNewChat);

  async function initApp(){
    await loadChatsIndex();
    if (chatsIndex.length > 0) {
      const sorted = [...chatsIndex].sort((a, b) => b.updatedAt - a.updatedAt);
      currentChatId = sorted[0].id;
      history = await loadChat(currentChatId);
      renderHistoryIntoChat();
    } else {
      currentChatId = uid();
    }
    renderChatList();
  }
  initApp();

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  async function sendMessage(text){
    addRow('user', text);
    history.push({ role: 'user', content: text });

    sendBtn.disabled = true;
    const botBubble = addRow('bot', null);

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });
      if (!response.ok) throw { code: response.status === 429 ? 'rate_limited' : 'error' };
      const data = await response.json();
      const reply = (data.text || '').trim() || 'No obtuve respuesta, probá de nuevo.';

      const textContainer = document.createElement('div');
      renderMessage(textContainer, reply);
      botBubble.innerHTML = '';
      botBubble.appendChild(textContainer);
      addMessageActions(botBubble, 'bot', reply);

      history.push({ role: 'assistant', content: reply });

      // Update chats index + persist
      let entry = chatsIndex.find(c => c.id === currentChatId);
      const title = (history[0] && history[0].content ? history[0].content : 'Chat').slice(0, 42);
      if (!entry) {
        entry = { id: currentChatId, title, updatedAt: Date.now() };
        chatsIndex.push(entry);
      } else {
        entry.updatedAt = Date.now();
        if (!entry.title) entry.title = title;
      }
      await saveChatsIndex();
      await saveCurrentChat();
      renderChatList();
    } catch (err) {
      const textContainer = document.createElement('div');
      const msgs = {
        rate_limited: '⚠ Nexora alcanzó su límite gratuito por ahora. Probá de nuevo en unos minutos (o mañana).'
      };
      textContainer.textContent = msgs[err && err.code] || '⚠ Ocurrió un error al responder. Probá de nuevo en un momento.';
      history.pop();
      botBubble.innerHTML = '';
      botBubble.appendChild(textContainer);
      console.error(err);
    } finally {
      sendBtn.disabled = false;
      scrollDown();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = 'auto';
    sendMessage(text);
  });
</script>

</body>
</html>
